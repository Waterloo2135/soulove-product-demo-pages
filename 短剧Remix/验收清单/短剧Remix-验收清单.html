["点击模糊 clip"],"expected":"弹出与解锁 private photo 同类会员墙 unlockBlur，不是短剧付费墙；马赛克视频仍在播"},{"id":"RX-07","module":"Inspiration","title":"Plus 可看模糊样片全片","priority":"P1","preconditions":"Persona=plus","data":"plus","steps":["点击原 memberOnly 样片"],"expected":"无会员墙，放大页清晰播放"},{"id":"RX-08","module":"Inspiration","title":"plat 过滤","priority":"P2","preconditions":"Web Demo","data":"plats ios-only 示例","steps":["浏览 Inspiration 全部卡片"],"expected":"iOS-only 示例不出现"},{"id":"RX-09","module":"放大页","title":"Remix 进入 Creation","priority":"P0","preconditions":"放大播放页","data":"-","steps":["点击 Remix"],"expected":"进入 Creation，角色与 prompt 带入该 clip"},{"id":"RX-10","module":"放大页","title":"Extend 进入续写","priority":"P0","preconditions":"clip 已生成完成","data":"-","steps":["点击 Extend"],"expected":"进入 Extend scene：左成片、右尾帧；提交价与 Remix 一致"},{"id":"RX-11","module":"My Remixes","title":"自己的 clip 可 Remix","priority":"P0","preconditions":"已有自己的成片","data":"-","steps":["列表或放大页点 Remix"],"expected":"进入 Creation 再生成，不是只能 Extend"},{"id":"RX-12","module":"My Remixes","title":"生成中不可 Extend","priority":"P1","preconditions":"刚提交生成","data":"-","steps":["观察生成中卡片"],"expected":"无 Extend 或不可点"},{"id":"RX-13","module":"Creation","title":"运营预设绑定","priority":"P1","preconditions":"Creation","data":"d1","steps":["进入 Creation","点刷新"],"expected":"默认角色与 prompt 成套；刷新换下一套并清空自选角色，可覆盖 Intent"},{"id":"RX-14","module":"Creation","title":"角色条与 @","priority":"P1","preconditions":"Creation","data":"-","steps":["横滑点选本剧角色","点 @","点 My Characters"],"expected":"My Characters 固定、右侧可滑；@ 仅已选；弹窗 Recent chats / My lovers；最多 3 人"},{"id":"RX-15","module":"Creation","title":"Intent 方案 B","priority":"P1","preconditions":"Creation 已有角色","data":"仅 Elena","steps":["点 Blowjob"],"expected":"按性别补男主，prompt 变为动作句，角色尽量保留"},{"id":"RX-16","module":"Creation","title":"Guest 或 Gems 不足","priority":"P0","preconditions":"Creation 填好 prompt","data":"guest 或 gems 不足","steps":["点 Generate"],"expected":"Guest 登录墙；Gems 不足 Gems 墙；成功则进 My Remixes"}]}</script><script src="../../scripts/
